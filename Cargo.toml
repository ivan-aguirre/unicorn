[package]
name = "unicorn"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Jogo de plataforma para crianças pequenas: um unicórnio fofo coleta corações."
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
fastrand = "2.5.0"
macroquad = { version = "0.4.16", default-features = false, features = ["audio"] }

[dev-dependencies]
# Mesmo decodificador usado pelo macroquad (quad-snd) para abrir os efeitos sonoros.
audrey = { version = "0.3.0", default-features = false, features = ["wav"] }

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Complexidade (limites em clippy.toml).
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
excessive_nesting = "deny"
# Proibições de robustez.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
# Dependências transitivas duplicadas não são controláveis por nós.
multiple_crate_versions = "allow"
# Metadados de publicação no crates.io não se aplicam (projeto privado).
cargo_common_metadata = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Jogo: dependências otimizadas mesmo em dev, para rodar liso durante o desenvolvimento.
[profile.dev.package."*"]
opt-level = 3
